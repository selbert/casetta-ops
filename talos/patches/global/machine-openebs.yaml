machine:
  sysctls:
    vm.nr_hugepages: "1024"
  kubelet:
    extraMounts:
      - destination: /var/local
        type: bind
        source: /var/local
        options:
          - bind
          - rshared
          - rw
  kernel:
    modules:
      - name: nvme_tcp
      - name: nvme_core
      - name: nvme_fabrics
