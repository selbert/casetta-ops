---
# yaml-language-server: $schema=https://json.schemastore.org/helmfile

# Bootstraps core applications that provide a minimal runtime base for the
# cluster. These releases are installed first so the cluster has the resources
# Flux needs before its own reconciliation begins.
#
# After this bootstrap phase, Flux is ready to take over management of the
# application stack and continue reconciling downstream state.

helmDefaults:
  cleanupOnFail: true
  forceConflicts: true
  wait: true
  waitForJobs: true

bases:
  - default.yaml

releases:
  - name: cilium
    namespace: kube-system
    inherit:
      - template: default

  - name: coredns
    namespace: kube-system
    inherit:
      - template: default
    needs: ["kube-system/cilium"]

  - name: spegel
    namespace: kube-system
    inherit:
      - template: default
    needs: ["kube-system/coredns"]

  - name: cert-manager
    namespace: cert-manager
    inherit:
      - template: default
    needs: ["kube-system/spegel"]


  - name: external-secrets
    namespace: external-secrets
    inherit:
      - template: default
    needs: ['cert-manager/cert-manager']

  - name: onepassword
    namespace: external-secrets
    inherit:
      - template: default
    hooks:
      - # Wait for ExternalSecrets CRDs to be available
        command: bash
        args:
          - -c
          - until kubectl get crd clustersecretstores.external-secrets.io &>/dev/null; do sleep 5; done
        events:
          - postsync
        showlogs: true
      - # Apply ExternalSecret Resources
        command: kubectl
        args:
          - apply
          - --server-side
          - --field-manager=kustomize-controller
          - --filename=../../kubernetes/apps/external-secrets/onepassword/app/clustersecretstore.yaml
        events:
          - postsync
        showlogs: true
    needs: ['external-secrets/external-secrets']

  - name: flux-operator
    namespace: flux-system
    inherit:
      - template: default
    needs: ['cert-manager/cert-manager']

  - name: flux-instance
    namespace: flux-system
    inherit:
      - template: default
    needs: ["flux-system/flux-operator"]
